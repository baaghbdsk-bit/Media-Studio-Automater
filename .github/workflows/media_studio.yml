name: Media Studio Cloud Autopilot (YouTube Shorts, Instagram Reels, Pinterest, Threads)

on:
  schedule:
    # 2 short-form slots at ~17:30 and ~21:30 IST (UTC+05:30).
    # Uses off-peak minute (:55 -> 17:25 and 21:25 IST) to avoid GitHub Actions :00 queue drops.
    - cron: '55 11,15 * * *'
    # 16:9 long-form slot at ~22:25 IST (1h after 21:30 short), published on alternate days only.
    - cron: '55 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (simulate without publishing)'
        required: false
        default: 'false'
        type: string
      topic:
        description: 'Optional custom topic for render-only demos'
        required: false
        default: ''
        type: string
      action:
        description: 'Action to execute'
        required: false
        default: 'schedule-autopilot'
        type: choice
        options:
          - schedule-autopilot
          - studio-all
          - youtube-explainer
          - long-explainer
          - youtube
          - instagram-reel
          - pinterest
          - threads
          - generate-video
          - generate-explainer

concurrency:
  group: 'media-studio-cloud-engine'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media-studio-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, fonts, cairo, pango for Manim)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libpango1.0-dev libcairo2-dev pkg-config

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js (for HyperFrames Render Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies (HyperFrames)
        run: |
          npm ci || npm install

      - name: Install Playwright Browsers (Chromium)
        run: |
          playwright install chromium --with-deps

      - name: Pre-flight Health & Auth Check
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          PINTEREST_COOKIES_BASE64: ${{ secrets.PINTEREST_COOKIES_BASE64 }}
          THREADS_COOKIES_BASE64: ${{ secrets.THREADS_COOKIES_BASE64 }}
        run: |
          python main.py doctor

      - name: Surface auth problems as CI warnings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_file = Path("output/doctor_status.json")
          if not status_file.exists():
              raise SystemExit(0)
          for name, info in json.loads(status_file.read_text(encoding="utf-8")).items():
              if info.get("status") not in (None, "ok"):
                  print(f"::warning::{name}: {info.get('detail', info.get('status'))}")
          PY

      - name: Execute Media Studio Production & Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash'
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          PINTEREST_COOKIES_BASE64: ${{ secrets.PINTEREST_COOKIES_BASE64 }}
          THREADS_COOKIES_BASE64: ${{ secrets.THREADS_COOKIES_BASE64 }}
          EDGE_TTS_PROXY: ${{ secrets.EDGE_TTS_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
        run: |
          ACTION="${{ github.event.inputs.action || 'schedule-autopilot' }}"
          if [ "${{ github.event.schedule }}" = "55 16 * * *" ]; then
            ACTION="long-explainer"
          fi
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          echo "🚀 Executing action: $ACTION (dry_run: ${{ github.event.inputs.dry_run || 'false' }})"
          python main.py "$ACTION" $DRY_RUN_FLAG --topic "$TOPIC"

      - name: Persist Studio State & Topic History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add studio_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): sync studio state and published topics [skip ci]" || true
          fi
          git pull --rebase origin master --autostash || true
          git push origin master || true

      - name: Upload rendered media for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-media-${{ github.run_number }}
          path: |
            generated_visuals/videos/**/*.mp4
            generated_visuals/videos/**/*.srt
            generated_visuals/videos/**/*.jpg
          if-no-files-found: ignore
          retention-days: 14
