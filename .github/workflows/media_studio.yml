name: Media Studio Cloud Autopilot (YouTube Shorts, Instagram Reels, Pinterest, Threads)

on:
  schedule:
    # 4 short-form slots at 08:40, 12:40, 17:40 and 19:40 IST (UTC+05:30).
    # Uses off-peak minute (:10) to prevent GitHub Actions from dropping cron triggers.
    # On long-form days the engine skips the 19:40 short to protect the
    # 10,000 unit/day YouTube quota (3 shorts + 1 long = 8,000 units).
    - cron: '10 3,7,12,14 * * *'
    # 16:9 long-form slot at 21:40 IST, published on alternate days only.
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (simulate without publishing)'
        required: false
        default: 'false'
        type: string
      action:
        description: 'Action to execute'
        required: false
        default: 'schedule-autopilot'
        type: choice
        options:
          - schedule-autopilot
          - studio-all
          - youtube-explainer
          - long-explainer
          - youtube
          - instagram-reel
          - pinterest
          - threads
          - generate-video

concurrency:
  group: 'media-studio-cloud-engine'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  media-studio-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, fonts, cairo, pango for Manim)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libpango1.0-dev libcairo2-dev pkg-config

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js (for HyperFrames Render Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies (HyperFrames)
        run: |
          npm ci || npm install

      - name: Install Playwright Browsers (Chromium)
        run: |
          playwright install chromium --with-deps

      - name: Pre-flight Health & Auth Check
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          PINTEREST_COOKIES_BASE64: ${{ secrets.PINTEREST_COOKIES_BASE64 }}
          THREADS_COOKIES_BASE64: ${{ secrets.THREADS_COOKIES_BASE64 }}
        run: |
          python main.py doctor

      - name: Execute Media Studio Production & Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash'
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          PINTEREST_COOKIES_BASE64: ${{ secrets.PINTEREST_COOKIES_BASE64 }}
          THREADS_COOKIES_BASE64: ${{ secrets.THREADS_COOKIES_BASE64 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ACTION="${{ github.event.inputs.action || 'schedule-autopilot' }}"
          if [ "${{ github.event.schedule }}" = "10 16 * * *" ]; then
            ACTION="long-explainer"
          fi
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          echo "🚀 Executing action: $ACTION (dry_run: ${{ github.event.inputs.dry_run || 'false' }})"
          python main.py "$ACTION" $DRY_RUN_FLAG

      - name: Persist Studio State & Topic History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add studio_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): sync studio state and published topics [skip ci]" || true
          fi
          git pull --rebase origin master --autostash || true
          git push origin master || true
